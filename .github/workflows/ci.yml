name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  IMAGE: ghcr.io/snowballsh/openbench
  LOCAL_IMAGE: openbench:ci

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: '0.16.9'
          args: --version
      - run: .github/scripts/lint.sh

  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: pip install -r requirements.txt -r Client/requirements.txt
      - run: python manage.py test OpenBench
        env:
          OPENBENCH_SECRET_KEY: ci-only

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          build-args: SOURCE_COMMIT=${{ github.sha }}
          tags: ${{ env.LOCAL_IMAGE }}
          load: true
          push: false
          cache-from: type=gha,scope=openbench-image
          cache-to: type=gha,scope=openbench-image,mode=max
      - name: Serve the image read-only and probe it
        run: .github/scripts/probe-image.sh "${LOCAL_IMAGE}"
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: docker save "${LOCAL_IMAGE}" | gzip -1 > image.tar.gz
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image
          path: image.tar.gz
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [lint, server, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
      - run: gunzip -c image.tar.gz | docker load
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image
        run: |
          for tag in "sha-${GITHUB_SHA}" latest; do
            docker tag "${LOCAL_IMAGE}" "${IMAGE}:${tag}"
            docker push "${IMAGE}:${tag}"
          done
      - name: Record the registry digest
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA}" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest for ${IMAGE}:sha-${GITHUB_SHA}" >&2; exit 1; }
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:snowballsh/openbench:pull" | jq -r '.token // empty' || true)"
          anonymous="$(curl -s -o /dev/null -w '%{http_code}' -I \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/snowballsh/openbench/manifests/${digest}")"
          {
            echo "### OpenBench image"
            echo ""
            echo '```'
            echo "${IMAGE}@${digest}"
            echo '```'
            echo ""
            echo "Built and served-image tested at commit ${GITHUB_SHA}; tags sha-${GITHUB_SHA} and latest."
            echo "Anonymous pull of the digest answers ${anonymous}; the SnowSys host holds no registry credential, so the package must be public."
          } >> "${GITHUB_STEP_SUMMARY}"
          [[ "${anonymous}" == "200" ]] || echo "::warning::${IMAGE} is not anonymously pullable (HTTP ${anonymous}); make the package public before deploying"
