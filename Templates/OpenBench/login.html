{% extends "OpenBench/base.html" %}

{% block content %}

    <form method="POST" action="/login/">
        {% csrf_token %}
        <div class="form">
            <div class="col">
                <div class="row">
                    <label for="login-username">Username</label> <input id="login-username" type="text" name="username" autocomplete="username">
                </div>
                <div class="row">
                    <label for="login-password">Password</label> <input id="login-password" type="password" name="password" autocomplete="current-password">
                </div>
                <input type="submit" name="submit" value="Login" class="anchorbutton btn-blue w-100">
            </div>
        </div>
    </form>

{% endblock %}
