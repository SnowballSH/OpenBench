<nav class="mt-3" id="pagebrowse" aria-label="Pages">
    {% if paging.prev != paging.next %}
        <div class="pagination">
            <a class="page previous" href="/{{ paging.url }}/{{ paging.prev }}/{{ paging.query }}" aria-label="Previous page">
                <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
            </a>
            <div class="pages">
                {% for page in paging.pages %}
                    {% if page == "..." %}
                        <span class="page ellipsis"><i class="fa-solid fa-fw fa-1x fa-ellipsis" aria-hidden="true"></i><span class="visually-hidden">More pages</span></span>
                    {% elif page == paging.page %}
                        <a class="page current" aria-current="page" href="/{{ paging.url }}/{{ page }}/{{ paging.query }}">{{ page }}</a>
                    {% else %}
                        <a class="page" href="/{{ paging.url }}/{{ page }}/{{ paging.query }}">{{ page }}</a>
                    {% endif %}
                {% endfor %}
            </div>
            <a class="page next" href="/{{ paging.url }}/{{ paging.next }}/{{ paging.query }}" aria-label="Next page">
                <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
            </a>
        </div>
    {% endif %}
</nav>
