{% extends "OpenBench/base.html" %}

{% block content %}

    <form method="post" enctype="multipart/form-data" id="network-form" data-action-template="/networks/{network-engine}/upload/{network-name}/">
        {% csrf_token %}
        <div class="form">
             <div class="col">
                <div class="row">
                    <label for="network-name">Name</label>
                    <input id="network-name" name="name">
                </div>
                <div class="row">
                    <label for="netfile">Weights</label>
                    <input id="netfile" name="netfile" type="file">
                </div>
                <div class="row">
                    <label for="network-engine">Engine</label>
                    <select id="network-engine" name="engine">
                    {% for engine in engines %}
                        {% if engine.name == profile.engine %}
                            <option selected value="{{ engine.name }}">{{ engine.name }}</option>
                        {% else %}
                            <option value="{{ engine.name }}">{{ engine.name }}</option>
                        {% endif %}
                    {% endfor %}
                    </select>
                </div>
                <input type="submit" class="anchorbutton btn-blue w-100" value="Upload">
            </div>
        </div>
    </form>

{% endblock %}
